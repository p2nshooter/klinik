<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Global Klinik</title>
<link rel="icon" href="/assets/img/favicon.svg">
<style>
:root{--bg:#f6f8f7;--ink:#0b1f33;--muted:#5b6b7b;--p:#0f766e}
@media (prefers-color-scheme:dark){:root{--bg:#071312;--ink:#e8f1ef;--muted:#93a7a4;--p:#2bb3a3}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;padding:24px;text-align:center}
img{width:84px;height:84px;margin:0 auto 18px}
h1{font:600 1.8rem Georgia,serif;margin:0 0 8px}
p{color:var(--muted);max-width:420px;margin:0 auto 22px}
a{display:inline-block;background:var(--p);color:#fff;text-decoration:none;padding:12px 22px;border-radius:999px;font-weight:700}
</style>
</head>
<body><main><img src="/assets/img/logo-mark.svg" alt="Global Klinik"><h1>Anda sedang offline</h1><p>Periksa koneksi internet Anda. Halaman yang pernah dibuka tetap dapat diakses, dan data akan diperbarui otomatis saat online kembali.</p><a href="/app/">Coba lagi</a></main></body>
</html>
