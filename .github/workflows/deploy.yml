name: Deploy Global Klinik

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

concurrency:
  group: deploy-global-klinik
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Several common secret names are accepted so the existing repository secrets work as-is.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || secrets.CF_TOKEN_KEY || secrets.CLOUDFLARE_TOKEN_KEY || secrets.TOKEN_KEY || secrets.API_TOKEN || secrets.CF_API_KEY || secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CF_TOKEN_ID || secrets.CLOUDFLARE_TOKEN_ID || secrets.TOKEN_ID || secrets.ACCOUNT_ID || secrets.CF_ID || secrets.CLOUDFLARE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Check code
        run: npm run check

      - name: Verify Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Secret API token Cloudflare tidak ditemukan (CLOUDFLARE_API_TOKEN)"; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::warning::CLOUDFLARE_ACCOUNT_ID tidak ditemukan — wrangler akan mencoba mendeteksi akun dari token"; fi
          echo "Secrets OK"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply global-klinik-db --remote

      - name: Seed demo data (only when the database is empty)
        continue-on-error: true
        run: |
          N=$(npx wrangler d1 execute global-klinik-db --remote --command "SELECT COUNT(*) AS n FROM patients" --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s)[0].results[0].n)}catch(e){console.log('unknown')}})")
          echo "patients in database: $N"
          if [ "$N" = "0" ]; then
            node scripts/seed-demo.mjs
            npx wrangler d1 execute global-klinik-db --remote --file seed/demo.sql --yes
          fi

      - name: Deploy Worker
        run: npx wrangler deploy 2>&1 | tee deploy.log

      - name: Smoke test
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | head -1)
          echo "Deployed URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          [ -z "$URL" ] && exit 0
          sleep 8
          for p in /api/health / /en /layanan /dokter /booking /app/ /manifest.webmanifest /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$p")
            echo "$code  $p"
          done
          curl -sf "$URL/api/health"
